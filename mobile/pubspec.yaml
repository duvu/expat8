name: expat8_language_app
description: Flutter mobile app for swipe-based vocabulary learning.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  http: ^1.2.2
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3
  flutter_tts: ^4.1.0
  just_audio: ^0.9.38
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  record: ^5.1.2
  share_plus: 10.1.2
  uuid: ^4.4.2

dev_dependencies:
  build_runner: ^2.4.11
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  objectbox_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/seed_vocab/en.json
    - assets/seed_vocab/zh.json
    - assets/seed_vocab/vi.json
