# Runs every test suite on pull requests and on pushes to main.
# Backend tests include the PostgreSQL migration/integration suites.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expat8
          POSTGRES_PASSWORD: expat8
          POSTGRES_DB: expat8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expat8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://expat8:expat8@localhost:5432/expat8_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # PostgreSQL suites share one database, so run test files serially.
      - run: npm test -- --test-concurrency=1
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5' # keep in sync with mobile/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android-build:
    # Compiles a release APK without release secrets (debug-signed, dummy
    # backend config) so Gradle/AGP/plugin breakage shows up before tagging.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5' # keep in sync with mobile/.fvmrc
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build apk --release
          --dart-define=BACKEND_BASE_URL=https://backend.invalid
          --dart-define=APP_CREDENTIAL_APP_ID=ci-build-check
          --dart-define=APP_CREDENTIAL_SECRET=ci-build-check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expat8-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: expat8-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
